<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Social Task NG</title>
<style>
body{font-family:Arial;background:#f5f5f5;margin:0;padding:10px}
.task-card{background:white;padding:15px;margin:10px 0;border-radius:10px;box-shadow:0 2px 5px rgba(0,0,0,0.1)}
input,select{width:90%;padding:10px;margin:5px 0;border:1px solid #ccc;border-radius:5px}
button{cursor:pointer}
#proofModal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5)}
.modal-content{background:white;width:90%;max-width:400px;margin:100px auto;padding:20px;border-radius:10px}
</style>
</head>
<body>

<h2>Post New Task</h2>
<input id="taskTitle" placeholder="Task Title">
<input id="taskLink" placeholder="Task Link (https://)">
<select id="taskPlatform" onchange="updateActionOptions()">
<option value="Instagram">Instagram</option>
<option value="Facebook">Facebook</option>
<option value="TikTok">TikTok</option>
<option value="Twitter">Twitter/X</option>
<option value="YouTube">YouTube</option>
</select>
<select id="taskAction">
<option value="Follow">Follow</option>
<option value="Like">Like</option>
<option value="Comment">Comment</option>
<option value="Custom Comment">Custom Comment</option>
</select>
<input id="customCommentInput" placeholder="Enter comment to be copied (if Custom Comment)">
<input id="taskQuantity" type="number" placeholder="How many people?">
<button onclick="createTask()" style="background:#0a7e07;color:white;padding:10px 20px;border:none;border-radius:5px;width:90%">Post Task</button>

<h2>Home Tasks</h2>
<div id="homeTasks"></div>

<h2>All Tasks</h2>
<div id="allTasks"></div>
<div id="pagination"></div>
<h2>Admin - Proofs</h2>
<div id="adminProofs"></div>

<h2>Admin - Pending Balance -> Earning</h2>
<div id="pendingBalList"></div>

<h2>Admin - Users</h2>
<div id="userList"></div>

<h2>Admin - Deposits</h2>
<div id="depositList"></div>

<!-- Proof Modal -->
<div id="proofModal"><div class="modal-content">
<h3>Submit Proof</h3>
<input type="hidden" id="proofTaskId">
<input id="proofInput" placeholder="Enter your username / proof">
<button onclick="submitProof()" style="background:#0a7e07;color:white;padding:8px 15px;border:none;border-radius:5px">Submit</button>
<button onclick="closeProofModal()" style="background:red;color:white;padding:8px 15px;border:none;border-radius:5px">Close</button>
</div></div>

<script src="app.js"></script>
</body>
  </html>
